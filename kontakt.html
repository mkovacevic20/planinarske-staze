<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt | Planinarske staze Hrvatske</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="StazeHR – početna">
        <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M2 43 L17 15 L24.5 27 L31 18 L46 43 Z" fill="currentColor"/>
          <path class="ridge" d="M17 15 L12.2 24 L15.5 22.5 L17.8 25 L20.6 21.4 Z"/>
          <path class="ridge" d="M31 18 L27.6 23.6 L30.2 22.6 L32.2 24.6 L34.3 23.3 Z"/>
          <circle cx="37" cy="9" r="6.5" fill="#c62f28"/>
          <circle cx="37" cy="9" r="2.8" fill="#fff"/>
        </svg>
        Staze<span>HR</span>
      </a>
      <nav class="main-nav" aria-label="Glavna navigacija">
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html">Početna</a></li>
          <li><a href="staze.html">Staze</a></li>
          <li><a href="savjeti.html">Savjeti i oprema</a></li>
          <li><a href="kontakt.html" class="active">Kontakt</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Promijeni temu">🌙</button>
        <button class="nav-toggle" id="nav-toggle" aria-label="Otvori izbornik" aria-expanded="false" aria-controls="nav-links">☰</button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-title">
      <div class="container">
        <h1>Kontakt</h1>
        <p>Predloži novu stazu ili nam pošalji pitanje.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <h2><span class="marker"></span>Pošalji nam poruku</h2>
          <p>Sva su polja obavezna. Provjerit ćemo unos prije prikaza potvrde.</p>
        </div>
        <form class="form" id="contact-form" novalidate>
          <label for="ime">Ime</label>
          <input type="text" id="ime" name="ime" autocomplete="name" required aria-describedby="ime-error">
          <span class="field-error" id="ime-error" aria-live="polite"></span>

          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error">
          <span class="field-error" id="email-error" aria-live="polite"></span>

          <label for="poruka">Poruka</label>
          <textarea id="poruka" name="poruka" rows="5" required aria-describedby="poruka-error"></textarea>
          <span class="field-error" id="poruka-error" aria-live="polite"></span>

          <button type="submit" class="btn">Pošalji</button>
        </form>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 StazeHR</p>
      <p>U nuždi: <strong>112</strong> (HGSS)</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/savjeti.js"></script>
  <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2026/11/26/12/20261126123254-36CUXJLF.js" defer></script>
</body>
</html>
